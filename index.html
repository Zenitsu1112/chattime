<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Prevent rubber-band scrolling on iOS/mobile */
    body { overscroll-behavior-y: none; }
    .sheet-transition {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 flex justify-center h-screen overflow-hidden">

  <!-- Mobile Wrapper -->
  <div class="w-full max-w-md h-full flex flex-col relative bg-zinc-900 border-x border-zinc-800 shadow-2xl">
    
    <!-- Top Header -->
    <header class="px-4 py-3 border-b border-zinc-800 flex items-center justify-between shrink-0 bg-zinc-900/90 backdrop-blur">
      <span class="font-bold tracking-tight text-white text-base">pocket<span class="text-indigo-400">hub</span></span>
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs text-zinc-400">online</span>
      </div>
    </header>

    <!-- TAB 1: FEED -->
    <main id="tab-feed" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20">
      
      <!-- Video Post -->
      <article class="bg-zinc-800/60 border border-zinc-700/50 rounded-xl p-3.5 space-y-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-indigo-500/20 text-indigo-400 font-bold flex items-center justify-center text-xs">R</div>
          <div>
            <p class="text-xs font-semibold text-zinc-200">Ranjan</p>
            <p class="text-[10px] text-zinc-500">12m ago</p>
          </div>
        </div>
        <p class="text-sm text-zinc-300">Clean breakdown of how low-level memory allocation actually functions.</p>
        <button onclick="openViewer('https://www.youtube.com/watch?v=dQw4w9WgXcQ', 'video')" 
                class="w-full bg-zinc-950/70 border border-zinc-700 rounded-lg p-3 text-left flex items-center justify-between hover:bg-zinc-850 active:scale-[0.99] transition">
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center text-sm">▶</span>
            <span class="text-xs font-medium text-zinc-300 truncate">YouTube Stream / Video</span>
          </div>
          <span class="text-xs text-zinc-500">Play ↗</span>
        </button>
      </article>

      <!-- Web Link Post -->
      <article class="bg-zinc-800/60 border border-zinc-700/50 rounded-xl p-3.5 space-y-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center text-xs">M</div>
          <div>
            <p class="text-xs font-semibold text-zinc-200">Murmu</p>
            <p class="text-[10px] text-zinc-500">35m ago</p>
          </div>
        </div>
        <p class="text-sm text-zinc-300">Checking out the Linux kernel documentation overview.</p>
        <button onclick="openViewer('https://en.wikipedia.org/wiki/Linux_kernel', 'web')" 
                class="w-full bg-zinc-950/70 border border-zinc-700 rounded-lg p-3 text-left flex items-center justify-between hover:bg-zinc-850 active:scale-[0.99] transition">
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-full bg-blue-500/10 text-blue-400 flex items-center justify-center text-sm">🌐</span>
            <span class="text-xs font-medium text-zinc-300 truncate">Wikipedia - Linux Kernel</span>
          </div>
          <span class="text-xs text-zinc-500">Read ↗</span>
        </button>
      </article>

    </main>

    <!-- TAB 2: CHAT (Hidden initially) -->
    <main id="tab-chat" class="hidden flex-1 overflow-hidden flex flex-col pb-16">
      <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="bg-zinc-800/70 max-w-[75%] p-2.5 rounded-lg text-xs leading-relaxed">
          Welcome to the stream. Drop links or discuss the feed posts here.
        </div>
      </div>
      <form onsubmit="handleChatSubmit(event)" class="p-3 border-t border-zinc-800 bg-zinc-900/90 flex gap-2">
        <input id="chat-input" type="text" placeholder="Type a message..." 
               class="flex-1 bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-indigo-500" />
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs font-medium">Send</button>
      </form>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="h-14 border-t border-zinc-800 bg-zinc-900/95 flex items-center justify-around shrink-0 absolute bottom-0 inset-x-0 z-30">
      <button onclick="switchTab('feed')" id="btn-feed" class="flex flex-col items-center gap-1 text-indigo-400 text-xs font-medium w-1/2 py-1">
        <span>📰</span>
        <span>Feed</span>
      </button>
      <button onclick="switchTab('chat')" id="btn-chat" class="flex flex-col items-center gap-1 text-zinc-500 text-xs font-medium w-1/2 py-1">
        <span>💬</span>
        <span>Chat</span>
      </button>
    </nav>

    <!-- Bottom Sheet Modal (In-App Viewer) -->
    <div id="sheet-backdrop" onclick="closeViewer()" 
         class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity opacity-0"></div>

    <div id="sheet" 
         class="fixed inset-x-0 bottom-0 max-w-md mx-auto h-[88vh] bg-zinc-900 border-t border-zinc-700 rounded-t-2xl z-50 flex flex-col translate-y-full sheet-transition shadow-2xl">
      
      <!-- Drag Handle & Controls -->
      <div class="px-4 py-3 border-b border-zinc-800 flex items-center justify-between shrink-0">
        <div class="w-10 h-1 bg-zinc-700 rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
        <a id="sheet-external" href="#" target="_blank" class="text-[11px] text-zinc-400 hover:text-indigo-400 truncate max-w-[200px] flex items-center gap-1">
          <span id="sheet-title">Preview</span>
          <span>↗</span>
        </a>
        <button onclick="closeViewer()" class="text-xs font-semibold px-2 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300">
          Close ✕
        </button>
      </div>

      <!-- Frame Area -->
      <div class="flex-1 bg-black relative">
        <iframe id="sheet-frame" class="w-full h-full border-0" 
                allow="autoplay; encrypted-media; fullscreen" 
                sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
      </div>
    </div>

  </div>

  <script>
    // Tab Switching
    function switchTab(tab) {
      const feed = document.getElementById('tab-feed');
      const chat = document.getElementById('tab-chat');
      const btnFeed = document.getElementById('btn-feed');
      const btnChat = document.getElementById('btn-chat');

      if (tab === 'feed') {
        feed.classList.remove('hidden');
        chat.classList.add('hidden');
        btnFeed.className = "flex flex-col items-center gap-1 text-indigo-400 text-xs font-medium w-1/2 py-1";
        btnChat.className = "flex flex-col items-center gap-1 text-zinc-500 text-xs font-medium w-1/2 py-1";
      } else {
        chat.classList.remove('hidden');
        feed.classList.add('hidden');
        btnChat.className = "flex flex-col items-center gap-1 text-indigo-400 text-xs font-medium w-1/2 py-1";
        btnFeed.className = "flex flex-col items-center gap-1 text-zinc-500 text-xs font-medium w-1/2 py-1";
      }
    }

    // Viewer Logic
    function openViewer(url, type) {
      const sheet = document.getElementById('sheet');
      const backdrop = document.getElementById('sheet-backdrop');
      const frame = document.getElementById('sheet-frame');
      const externalLink = document.getElementById('sheet-external');
      const title = document.getElementById('sheet-title');

      externalLink.href = url;
      title.textContent = url.replace('https://', '').split('/')[0];

      if (type === 'video') {
        const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=)([\w-]+)/);
        frame.src = ytMatch ? `https://www.youtube-nocookie.com/embed/${ytMatch[1]}?autoplay=1` : url;
      } else {
        frame.src = url;
      }

      backdrop.classList.remove('hidden');
      setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
      sheet.classList.remove('translate-y-full');
    }

    function closeViewer() {
      const sheet = document.getElementById('sheet');
      const backdrop = document.getElementById('sheet-backdrop');
      const frame = document.getElementById('sheet-frame');

      sheet.classList.add('translate-y-full');
      backdrop.classList.add('opacity-0');
      setTimeout(() => {
        backdrop.classList.add('hidden');
        frame.src = 'about:blank'; // stop audio/video
      }, 250);
    }

    // Chat mock append
    function handleChatSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const container = document.getElementById('chat-messages');
      const bubble = document.createElement('div');
      bubble.className = "bg-indigo-600/90 text-white max-w-[75%] p-2.5 rounded-lg text-xs leading-relaxed ml-auto";
      bubble.textContent = text;
      container.appendChild(bubble);

      input.value = '';
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
